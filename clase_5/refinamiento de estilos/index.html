<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="style.css">
        <title>Mayorista de Helados - Pedidos Online</title>
    </head>

    <body>
        <header>
            <h1>Mayorista de Helados</h1>
            <p>Pedidos Online</p>
        </header>

        <main>
            <form>
                <h2>Tu pedido</h2>

                <section>
                    <h3>Tus datos</h3>

                    <label for="nombre_apellido">Nombre y Apellido</label>
                    <input type="text" id="nombre_apellido" name="nombre_apellido" required>

                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </section>

                <section>
                    <h3>Tamaño</h3>


                    <div class="opcion-radio">
                    <input type="radio" id="chico" name="tamaño" value="chico">
                    <label for="Chico">3 kg (chico)</label>
                    </div>

                    <div class="opcion-radio">
                    <input type="radio" id="mediano" name="tamaño" value="mediano">
                    <label for="Mediano">6 kg (mediano)</label>
                    </div>
                    
                    <div class="opcion-radio">
                    <input type="radio" id="grande" name="tamaño" value="grande">
                    <label for="Grande">12 kg (grande)</label>
                    </div>
                </section>

                <section>
                    <h3>Sabor</h4>

                    <input type="checkbox" id="chocolate" name="chocolate" value="chocolate">   
                    <label for="chocolate">Chocolate</label>

                    <input type="checkbox" id="vainilla" name="vainilla" value="vainilla">   
                    <label for="vainilla">Vainilla</label>

                    <input type="checkbox" id="frutilla" name="frutilla" value="frutilla">   
                    <label for="frutilla">Frutilla</label>
                </section>

                <section>
                    <h3>Tipo de helado</h5>
                    <select id="helado" name="helado" required>
                        <option value="">Eligi</option>
                        <option value="agua">Agua</option>
                        <option value="crema">Crema</option>
                        <option value="premium">Premium</option>
                    </select>
                </section>

                <section>
                    <h3>Comentarios</h3>
                    
                    <label for="comentarios">¿Algun comentario? </label>
                    <textarea id="comentarios" name="comentarios" rows="4"></textarea>
                </section>

                <button type="submit">Hacer pedido  </button>
            </form>
        </main>
    </body>
</html>
